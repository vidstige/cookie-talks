<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bezier Curves</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ccc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    button {
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      padding: 5px 14px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.1s;
    }

    button:hover:not(:disabled) { background: #383838; }
    button:disabled { opacity: 0.35; cursor: default; }

    #info {
      font-size: 14px;
      color: #888;
      letter-spacing: 0.05em;
    }

    canvas {
      flex: 1;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="addBtn">+ point</button>
    <button id="removeBtn">− point</button>
    <span id="info"></span>
  </div>
  <canvas id="canvas"></canvas>
  <script src="bezier.js"></script>
</body>
</html>
